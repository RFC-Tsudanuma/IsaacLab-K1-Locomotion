# ゴールキーパーの到達点外挿と移動指令の共有定数
#
# ★ この YAML が **唯一の正**。sim (IsaacLab) と実機/MuJoCo デプロイノード (C++) の
#   両方がここを読むこと。片側だけ変えると、方策が学習時と違う入力を受け取る。
#   過去に goal half-width で同じ versioning ズレを起こしている。
#
# 読み出し側:
#   sim   : goalkeeper/mdp/shared_params.py -> GoalkeeperParamsCfg の既定を上書き
#   deploy: (未実装) rl_policy_gk_node が起動時に読む
#
# ---------------------------------------------------------------------------
# ☠ シムの物理に関する既知の注意 (2026-08-19 実測)
#
#   ボールは発射時に転がり整合の角速度 ω = (-vy, vx, 0)/r を与えられ、PhysX は
#   転がり抵抗を既定でモデル化しない。結果として **シム内でボールはほぼ減速しない**:
#
#       速度比 v_cross / v_launch = 98.8% (中央値、飛行 0.83s / 1.26m、n=1266)
#       dynamic_friction 0.35〜0.80 で層別しても 98.8〜98.9% で **変化なし**
#
#   したがって t_arrival の等速外挿はシムでは厳密 (誤差 -5.2ms、std 9.4ms)。
#   **実機の人工芝では転がり抵抗があるため、この前提は成り立たない。**
#   実機で減速を実測するまで、t_arrival は実機で系統的に「早く着く」と誤る。
# ---------------------------------------------------------------------------

version: 3

# ☠☠ 値を変えるときの必須手順 (2026-08-19 に一度誤った)
#
#   ここの値は **方策の観測 (obs[6:9] = velocity_commands, target_y)** に直結する。
#   したがって変更は「評価時のチューニング」ではなく **学習設定の変更**であり、
#   現行 ONNX (gk_08-17) はそのままでは使えず **再学習が必要**になる。
#   deploy 側 rl_policy_gk_node.cpp のコメントにも T_APPROACH は
#   「training's value, constant since 2026-08-08」と明記されている。
#
#   ★ 下の値は **現行 ONNX の学習条件**。動かす前に再学習の要否を判断すること。

# --- 優先1: 到達点外挿のガード ---
# 検出ノイズ σ = 0.124d + 0.149 (3m先で 0.52m) では、静止ボールでも vx 推定が
# 0.3 を超えうる。その状態で t = (x - guard_x)/closing が発散し、
# y_pred = y0 + vy0*t が ±max_y のクランプまで飛んでポスト際へ走る。
prediction:
  # ★ 現行 ONNX の学習値。deploy 側 APPROACH_VX_THRESHOLD=0.05 と対応するのは
  #   sim の関数引数既定 approach_vx_threshold=-0.05 の方で、こちらは別物。
  closing_min: 0.3      # 脅威とみなす最低接近速度 [m/s]  ← 学習値
  t_max: 3.0            # 到達時間の上限 [s]              ← 学習値 (deploy も 3.0)
  # 中央待機は 2026-08-19 に検討したが **学習設定の変更になる**ため既定 false。
  # true にすると closing < closing_min のとき target_y = 0 (従来は y_track)。
  idle_center_wait: false

# --- 優先2: 移動指令のゲインと不感帯 ---
# 旧: dy = (target_y - y) / 0.15  → ずれ 0.225m で全開 = 実質バンバン制御。
#     自己位置の揺れ (静止中でも 4秒で 0.27m ドリフト) がそのまま全開指令に化ける。
drive:
  # ★ 現行 ONNX の学習値。deploy 側 T_APPROACH と一致していること。
  horizon_fast: 0.15    # 脅威検出時の除数 [s]  ← 学習値
  horizon_idle: 1.0     # 脅威なしのときの除数 [s]
  # 不感帯は 2026-08-19 に検討したが **学習設定の変更になる**ため既定 0 (無効)。
  #   0.12 前後を入れるなら再学習とセットで。
  deadband_y: 0.0
  vy_scale: 1.3         # 横指令のクリップ [m/s] (TASK_DRIVE_VY_SCALE と揃える)
  vx_scale: 1.0         # 前後指令のクリップ [m/s]

# --- 優先3: 横追従 (y_track) のゲート (2026-08-21) ---
#
# 非脅威時の目標は y_track = ball_y * (guard_x / ball_x) で、これは「角度を切る」
# 立ち位置そのもの。しかし **ボールの速度も距離も見ていない**ため、
#
#   * ゴールから遠ざかる球
#   * 人が持って運んでいる球
#   * ゴールラインより後ろ (x < 0) の球
#
# にも等しく反応する。特に最後は深刻で、compute_target_y の
# ``x_ball = pos[:,0].clamp(min=guard_x)`` により **背後の球が角度係数 1.0 =
# 最大ゲインで追われる** (x=-1.0, y=1.0 の球で目標 y = 1.0m)。
# ゴール脇を人がボールを持って通っただけで全力で走る。実機で観測された症状。
#
# ★ ゲートが立つと target_y は 0 (中央) か self_y (その場保持) に寄るだけで、
#   **学習分布に無い値は作らない**。したがって現行 ONNX のままデプロイ側だけ
#   先に直しても、方策は未知の入力を受け取らない (再学習前でも安全)。
tracking:
  # vx がこれを超える (= ゴールから遠ざかる) 球は追わない [m/s]
  receding_vx_max: 0.3
  # ball_x がこれ未満 (= ゴールラインより後ろ・脇) の球は追わない [m]
  min_x: 0.2
  # ball_x がこれを超える (= 遠すぎる) 球は追わない [m]
  max_x: 4.0
  # |ball_y| がこれを超える (= ゴールポストの外へ出た) 球は追わない [m]
  #   ★ 従来は y_track を ±goal_half_width でクランプしていただけなので、
  #     ポストの真横まで歩いて張り付いていた。クランプではなく追従を止める。
  #   ★ y_max / y_exit はシュミットトリガ。境界で「追う/追わない」が毎ステップ
  #     入れ替わると目標が往復して自励振動になる (知覚ノイズは 3m 先で σ=0.52m)。
  #       追従中   -> y_exit まで許して追い続ける
  #       非追従中 -> y_max まで戻らないと再開しない
  y_max: 1.3
  y_exit: 1.5
  # ゲートが立ったときの目標。"center" = 0 へ戻る / "hold" = 現在位置を保持。
  #
  # ★ center を既定にする理由: hold は指令が出ないぶん静かだが、**待機中に
  #   ゴール中央へ戻らない**。セーブ直後の位置 (ポスト際のこともある) に留まり
  #   続けるので、次の球への守備位置として不正になる。
  #   一方 center の目標は定数 0 で知覚ノイズを含まないため、振動の原因には
  #   ならない (問題だったのは *ノイズで動く* 目標であって、動くこと自体ではない)。
  #   中央へ一度歩いて戻れば idle_hold (不感帯 0.25m) が掛かって静止する。
  #   セーブ直後のその場保持は post_save_hold が別途担当している。
  gated_target: center
