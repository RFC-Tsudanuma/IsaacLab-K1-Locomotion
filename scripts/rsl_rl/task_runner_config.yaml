# Task runner configuration for IsaacLab-K1-Locomotion (RSL-RL)

base:
  # Command to invoke Python (can be "python", "isaaclab.bat -p", "./isaaclab.sh -p", etc.)
  python_command: "auto"
  train_script: "scripts/rsl_rl/train.py"
  task: "Isaac-Velocity-Flat-K1-v0"
  num_envs: 4096
  headless: true
  experiment_name: "k1_flat_knee_sweep"
  run_name_format: "knee_eff{effort}_vel{velocity}"
  extra_args: []
  override_mode: "patched_register"
  patch_sim_limits: true
  task_runner_log_dir: "logs/task_runner"
  skip_completed: true
  ignore_completed: false
  # Optional path for persistent completed index registry.
  # If omitted, defaults to logs/rsl_rl/<experiment_name>/completed_indexes.json
  # CLI override: --completed-indexes-file <path>
  completed_indexes_file: null
  # Optional target index ranges for sweep.
  # Examples:
  #   index_ranges: ["0-10", "20-30"]
  #   index_ranges: ["0-10,20-30"]
  # Empty/null means all indexes in the generated sweep.
  # CLI override: --index-ranges 0-10,20-30
  index_ranges: null
  # CLI override: --ignore-completed
  # CLI takes priority over YAML.

  # Optional resume settings for all runs
  resume: false
  load_run: null
  checkpoint: null

sweep:
  # Target regex keys in actuator dict (Knee_Pitch only)
  joint_keys:
    - ".*_Knee_Pitch"

  # If end is "default", the value is taken from the env config
  effort_limit:
    start: 10
    step: 10
    end: default

  velocity_limit:
    start: 5
    step: 5
    end: default
